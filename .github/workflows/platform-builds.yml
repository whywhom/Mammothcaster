name: Platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Shared tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run shared and web tests
        run: ./gradlew --stacktrace :shared:desktopTest :shared:wasmJsBrowserTest

  platform-builds:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android bundle (Ubuntu)
            runner: ubuntu-24.04
            command: ./gradlew --stacktrace :androidApp:bundleRelease
            artifact: molliecaster-android-aab
            path: androidApp/build/outputs/bundle/release/*.aab
          - name: Web distribution (Ubuntu)
            runner: ubuntu-24.04
            command: ./gradlew --stacktrace :app:wasmJsBrowserDistribution
            artifact: molliecaster-web
            path: app/build/dist/wasmJs/productionExecutable/
          - name: Debian package (Ubuntu)
            runner: ubuntu-24.04
            command: ./gradlew --stacktrace :app:packageReleaseDeb
            artifact: molliecaster-linux-deb
            path: app/build/compose/binaries/main-release/deb/*.deb
          - name: Windows installer
            runner: windows-2025
            command: ./gradlew.bat --stacktrace :app:packageReleaseMsi
            artifact: molliecaster-windows-msi
            path: app/build/compose/binaries/main-release/msi/*.msi
          - name: macOS disk image
            runner: macos-26
            command: ./gradlew --stacktrace :app:packageReleaseDmg
            artifact: molliecaster-macos-dmg
            path: app/build/compose/binaries/main-release/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator app (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme Molliecaster
          -configuration Release
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/MolliecasterDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Archive iOS Simulator app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/MolliecasterDerivedData/Build/Products/Release-iphonesimulator/Molliecaster.app"
          "$RUNNER_TEMP/Molliecaster-iOS-Simulator.zip"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: molliecaster-ios-simulator-app
          path: ${{ runner.temp }}/Molliecaster-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
