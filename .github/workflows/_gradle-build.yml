name: Reusable Gradle build

on:
  workflow_call:
    inputs:
      job_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      command:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: ""
      artifact_path:
        required: false
        type: string
        default: ""

jobs:
  build:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run ${{ inputs.job_name }}
        run: ${{ inputs.command }}

      - name: Upload ${{ inputs.artifact_name }}
        if: inputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
