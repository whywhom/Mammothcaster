name: Reusable iOS build

on:
  workflow_call:

jobs:
  build:
    name: iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme Molliecaster
          -configuration Release
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/MolliecasterDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Archive iOS Simulator app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/MolliecasterDerivedData/Build/Products/Release-iphonesimulator/Molliecaster.app"
          "$RUNNER_TEMP/Molliecaster-iOS-Simulator.zip"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: molliecaster-ios-simulator
          path: ${{ runner.temp }}/Molliecaster-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
